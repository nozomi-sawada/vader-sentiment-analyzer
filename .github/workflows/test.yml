name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  golden-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run golden tests against the reference scores
        run: node test/run-tests.js
